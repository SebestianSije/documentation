version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: isp_billing
      POSTGRES_USER: isp_user
      POSTGRES_PASSWORD: isp_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isp_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - isp_network
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://isp_user:isp_secure_password_2024@db:5432/isp_billing
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - isp_network
    restart: unless-stopped
    command: gunicorn --workers 3 --bind 0.0.0.0:5000 app:app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/private:ro
      - ./static:/var/www/static:ro
    depends_on:
      - web
    networks:
      - isp_network
    restart: unless-stopped

  billing_worker:
    build: .
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://isp_user:isp_secure_password_2024@db:5432/isp_billing
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - isp_network
    restart: unless-stopped
    command: python utils/billing_automation.py
    
  scheduler:
    build: .
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://isp_user:isp_secure_password_2024@db:5432/isp_billing
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - isp_network
    restart: unless-stopped
    command: python -c "
import schedule
import time
import subprocess
import logging

logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)

def run_billing():
    logger.info('Running billing automation...')
    result = subprocess.run(['python', 'utils/billing_automation.py'], capture_output=True, text=True)
    if result.returncode == 0:
        logger.info('Billing automation completed successfully')
    else:
        logger.error(f'Billing automation failed: {result.stderr}')

# Schedule billing automation to run daily at 6 AM
schedule.every().day.at('06:00').do(run_billing)

logger.info('Scheduler started. Billing automation will run daily at 6 AM.')

while True:
    schedule.run_pending()
    time.sleep(60)
"

volumes:
  postgres_data:
  redis_data:

networks:
  isp_network:
    driver: bridge